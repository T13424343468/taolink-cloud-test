name: emulator-test
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  cloud-device-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host capability probe
        run: |
          uname -a; nproc; free -h; ls -l /dev/kvm || echo "NO_KVM_DEVICE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          ANDROID_HOME=$RUNNER_TEMP/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "emulator" "system-images;android-31;google_apis;x86_64"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Create AVD
        run: |
          export ANDROID_AVD_HOME=$HOME/.android/avd
          export ANDROID_USER_HOME=$HOME/.android
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n tlavd -k "system-images;android-31;google_apis;x86_64"
          CFG=$ANDROID_AVD_HOME/tlavd.avd/config.ini
          grep -q '^hw.gpu.enabled=' "$CFG" && sed -i 's|^hw.gpu.enabled=.*|hw.gpu.enabled=no|' "$CFG" || echo 'hw.gpu.enabled=no' >> "$CFG"
          grep -q '^hw.gpu.mode=' "$CFG" && sed -i 's|^hw.gpu.mode=.*|hw.gpu.mode=off|' "$CFG" || echo 'hw.gpu.mode=off' >> "$CFG"
          echo 'hw.cpu.ncore=4' >> "$CFG" || true
          echo 'hw.ramSize=3072' >> "$CFG" || true
          cat "$CFG"

      - name: Boot emulator
        run: |
          export ANDROID_AVD_HOME=$HOME/.android/avd
          export ANDROID_USER_HOME=$HOME/.android
          $ANDROID_HOME/emulator/emulator @tlavd -no-window -no-audio -no-boot-anim -no-snapshot -no-accel -gpu swiftshader_indirect -memory 3072 > emulator.log 2>&1 &
          sleep 40
          pgrep -f "emulator" > /dev/null || { echo EMULATOR_DIED; tail -80 emulator.log; exit 1; }

      - name: Wait for boot
        run: |
          START=$SECONDS
          while true; do
            if timeout 40 adb wait-for-device 2>/dev/null; then
              if timeout 40 adb shell getprop sys.boot_completed 2>/dev/null | grep -q '^1$'; then
                echo "BOOT_COMPLETED"; break
              fi
            fi
            [ $((SECONDS - START)) -gt 3600 ] && { echo BOOT_TIMEOUT; tail -120 emulator.log; exit 1; }
            sleep 15
          done
          adb shell getprop ro.build.version.release
          adb shell getprop ro.product.cpu.abilist

      - name: Stage 1 - install + cold start + auth flow
        run: |
          adb install -r taolink-0.2.3.apk
          adb shell pm list packages | grep com.tao.tao.link || { echo FAIL_PACKAGE_NOT_FOUND; exit 1; }
          adb logcat -c
          adb shell monkey -p com.tao.tao.link -c android.intent.category.LAUNCHER 1
          sleep 25
          adb shell "dumpsys activity activities | grep -i tao.tao.link | head -5" || echo "ACTIVITY_NOT_TOP"
          adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png shot-01-cold-start.png
          adb shell pm grant com.tao.tao.link android.permission.POST_NOTIFICATIONS 2>/dev/null || true
          adb shell pm grant com.tao.tao.link android.permission.CAMERA 2>/dev/null || true
          adb shell pm grant com.tao.tao.link android.permission.RECORD_AUDIO 2>/dev/null || true
          adb logcat -d > logcat-install-launch.txt || true
          adb shell settings put secure enabled_accessibility_services com.tao.tao.link/com.tao.tao.link.accessibility.TaoLinkAccessibilityService 2>/dev/null || echo "A11Y_GRANT_UNAVAILABLE"
          adb shell settings put secure accessibility_enabled 1 2>/dev/null || true
          adb shell settings get secure enabled_accessibility_services || true
          adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png shot-02-after-a11y.png

      - name: Stage 2 - UI walkthrough of 5 screens
        run: |
          dump_ui() {
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 && adb pull /sdcard/ui.xml "ui-$1.xml" || echo "DUMP_FAIL_$1"
            adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png "shot-$1.png" || true
          }
          tap_text() {
            XML="$1"; KEY="$2"
            LINE=$(grep -o 'text="'"$KEY"'".*bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"' "$XML" 2>/dev/null | head -1)
            if [ -z "$LINE" ]; then
              LINE=$(grep -o 'bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"[^>]*text="'"$KEY"'"' "$XML" 2>/dev/null | head -1)
            fi
            NUMS=$(echo "$LINE" | grep -oE '\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]' | head -1 | tr -d '[]' )
            echo "tap target $KEY -> $NUMS"
            if [ -n "$NUMS" ]; then
              X1=$(echo "$NUMS" | cut -d, -f1); Y1=$(echo "$NUMS" | cut -d, -f2)
              X2=$(echo "$NUMS" | cut -d, -f3); Y2=$(echo "$NUMS" | cut -d, -f4)
              X=$(( (X1 + X2) / 2 )); Y=$(( (Y1 + Y2) / 2 ))
              adb shell input tap "$X" "$Y"
            fi
          }
          dump_ui home
          grep -o 'text="[^"]*"' ui-home.xml 2>/dev/null | sort -u | head -30 > texts-home.txt || true
          cat texts-home.txt || true
          tap_text ui-home.xml "在附近找设备"
          sleep 8; dump_ui discover
          grep -o 'text="[^"]*"' ui-discover.xml 2>/dev/null | sort -u | head -20 > texts-discover.txt || true
          adb shell input keyevent 4; sleep 2
          tap_text ui-home.xml "输配对码连接"
          sleep 6; dump_ui pair-input
          grep -o 'text="[^"]*"' ui-pair-input.xml 2>/dev/null | sort -u | head -20 > texts-pair.txt || true
          adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png shot-pair-short.png || true
          adb shell input keyevent 4; sleep 2
          dump_ui home-final

      - name: Stage 3 - pairing code validity scope note
        run: |
          echo "PAIRING_CODE_5MIN: protocol-layer logic covered by unit tests (82/82); cloud dual-device live probe limited by Stage 4"

      - name: Stage 4 - two-device parallel control capability check
        run: |
          if ls -l /dev/kvm 2>/dev/null; then echo "KVM_PRESENT"; else echo "TWO_DEVICE_LIMIT: no KVM on runner; single emulator only; second device cannot boot in parallel"; fi
          echo "TWO_DEVICE_RESULT: not feasible on this runner (single emulator, no nested virtualization)"

      - name: Stage 5 - stability short-run + crash census
        run: |
          adb logcat -c
          (adb logcat -v time > logcat-continuous.txt 2>&1 &) || true
          sleep 300
          adb shell "dumpsys activity activities | grep -i tao.tao.link | head -5" > proc-5min.txt || true
          adb shell "dumpsys dropbox --print" > dropbox.txt 2>/dev/null || echo NO_DROPBOX
          grep -c "com.tao.tao.link" dropbox.txt > dropbox-count.txt || true
          adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png shot-5min.png
          adb logcat -d > logcat-final.txt || true
          grep -cE "FATAL EXCEPTION|ANR in com.tao.tao.link" logcat-final.txt > crash-count.txt || true
          echo "crash_count=$(cat crash-count.txt)"

      - name: Summarize verdict
        if: always()
        run: |
          {
            echo "== 云测 0.2.3 红绿清点 =="
            ls -1 shot-*.png ui-*.xml texts-*.txt 2>/dev/null
            echo "crash_count=$(cat crash-count.txt 2>/dev/null || echo NA)"
            echo "dropbox_taolink=$(cat dropbox-count.txt 2>/dev/null || echo NA)"
          } > verdict-summary.txt
          cat verdict-summary.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taolink-023-cloud-evidence
          path: |
            shot-*.png
            ui-*.xml
            texts-*.txt
            logcat-*.txt
            dropbox*.txt
            proc-5min.txt
            emulator.log
            verdict-summary.txt
          if-no-files-found: warn

      - name: Dump emulator log
        if: always()
        run: tail -150 emulator.log 2>/dev/null || echo NO_EMULATOR_LOG
