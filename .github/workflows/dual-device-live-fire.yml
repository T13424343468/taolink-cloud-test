name: dual-device-live-fire
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dual-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ADB_HOST: emulator-5554
      ADB_CTRL: emulator-5558
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host probe
        run: |
          nproc; free -h; ls -l /dev/kvm || echo NO_KVM
          if [ ! -e /dev/kvm ]; then echo "FAIL_NO_KVM"; exit 1; fi
          sudo chmod 666 /dev/kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          ANDROID_HOME=$RUNNER_TEMP/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "emulator" "system-images;android-31;google_apis;x86_64"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH

      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon > gradle-build.log 2>&1 || { tail -40 gradle-build.log; exit 1; }
          ls -l app/build/outputs/apk/debug/*.apk

      - name: Create two AVDs
        run: |
          export ANDROID_AVD_HOME=$HOME/.android/avd
          export ANDROID_USER_HOME=$HOME/.android
          mkdir -p "$ANDROID_AVD_HOME"
          for N in tlm tlc; do
            echo no | avdmanager create avd -n $N -k "system-images;android-31;google_apis;x86_64" || exit 1
            CFG=$ANDROID_AVD_HOME/$N.avd/config.ini
            sed -i 's|^hw.gpu.enabled=.*|hw.gpu.enabled=no|' "$CFG" 2>/dev/null || echo 'hw.gpu.enabled=no' >> "$CFG"
            echo 'hw.gpu.mode=off' >> "$CFG"
            echo 'hw.ramSize=2048' >> "$CFG"
          done
          ls -l "$ANDROID_AVD_HOME"

      - name: Boot both emulators
        run: |
          export ANDROID_AVD_HOME=$HOME/.android/avd
          export ANDROID_USER_HOME=$HOME/.android
          "$ANDROID_HOME/emulator/emulator" -avd tlm -port 5554 -no-window -no-boot-anim -gpu off > emu-master.log 2>&1 &
          "$ANDROID_HOME/emulator/emulator" -avd tlc -port 5558 -no-window -no-boot-anim -gpu off > emu-ctrl.log 2>&1 &
          sleep 5
          ps aux | grep -c "[e]mulator" || true
          for P in 5554 5558; do
            OK=0
            for i in $(seq 1 60); do
              BOOT=$(adb -s emulator-$P shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$BOOT" = "1" ]; then OK=1; echo "BOOT_OK_$P"; break; fi
              sleep 10
            done
            [ "$OK" = "1" ] || { echo "FAIL_BOOT_$P"; tail -30 emu-master.log emu-ctrl.log; exit 1; }
          done
          adb devices

      - name: Install APK on both devices
        run: |
          APK=app/build/outputs/apk/debug/$(ls app/build/outputs/apk/debug/ | grep '\.apk$' | head -1)
          adb -s $ADB_HOST install -r "$APK" || exit 1
          adb -s $ADB_CTRL install -r "$APK" || exit 1
          for D in $ADB_HOST $ADB_CTRL; do
            adb -s $D shell pm grant com.tao.tao.link android.permission.POST_NOTIFICATIONS 2>/dev/null || true
            adb -s $D shell pm grant com.tao.tao.link android.permission.CAMERA 2>/dev/null || true
            adb -s $D shell pm grant com.tao.tao.link android.permission.RECORD_AUDIO 2>/dev/null || true
            adb -s $D shell settings put secure enabled_accessibility_services com.tao.tao.link/com.tao.tao.link.accessibility.TaoLinkAccessibilityService 2>/dev/null || true
            adb -s $D shell settings put secure accessibility_enabled 1 2>/dev/null || true
          done
          echo INSTALL_BOTH_OK

      - name: "Stage A - controlled side, enter serve mode and read pairing code"
        run: |
          dump() { adb -s $2 shell uiautomator dump /data/local/tmp/u.xml >/dev/null 2>&1 && adb -s $2 pull /data/local/tmp/u.xml "$1" >/dev/null 2>&1; }
          tap() {
            LINE=$(grep -o "<node[^>]*text=\"$2\"[^>]*>" "$1" 2>/dev/null | grep -o 'bounds="\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]"' | head -1)
            NUMS=$(echo "$LINE" | grep -oE '\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]' | head -1 | tr -d '[]')
            [ -n "$NUMS" ] || { echo "TAP_MISS_$2"; return 1; }
            X1=$(echo "$NUMS"|cut -d, -f1);Y1=$(echo "$NUMS"|cut -d, -f2);X2=$(echo "$NUMS"|cut -d, -f3);Y2=$(echo "$NUMS"|cut -d, -f4)
            adb -s $3 shell input tap $(( (X1+X2)/2 )) $(( (Y1+Y2)/2 ))
          }
          adb -s $ADB_CTRL logcat -c
          # 通知权限（API 33+ startForeground 需要），避免前台服务崩溃
          adb -s $ADB_CTRL shell pm grant com.tao.tao.link android.permission.POST_NOTIFICATIONS 2>/dev/null || true
          adb -s $ADB_CTRL shell am start -n com.tao.tao.link/.ui.MainActivity; sleep 15
          # 被控端服务先起（debug 包已导出）：NSD 注册 + 48190 监听
          adb -s $ADB_CTRL shell am start-foreground-service -n com.tao.tao.link/.service.ControlledSessionService
          sleep 4
          adb -s $ADB_CTRL shell am start -n com.tao.tao.link/.ui.PairCodeActivity
          sleep 6
          dump ui-ctrl-1.xml $ADB_CTRL
          grep -o 'text="[^"]*"' ui-ctrl-1.xml | sort -u > texts-ctrl-1.txt || true
          cat texts-ctrl-1.txt
          CODE=$(grep -oE 'text="[0-9]{6}"' ui-ctrl-1.xml | head -1 | grep -oE '[0-9]{6}')
          if [ -z "$CODE" ]; then
            echo "RETRY_VIA_ROOT: restart adbd root with boot_completed polling"
            adb -s $ADB_CTRL root
            adb -s $ADB_CTRL wait-for-device
            for i in $(seq 1 10); do
              B=$(adb -s $ADB_CTRL shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              [ "$B" = "1" ] && break
              sleep 3
            done
            echo "boot_completed=$B"
            adb -s $ADB_CTRL shell am start-foreground-service -n com.tao.tao.link/.service.ControlledSessionService || true
            sleep 5
            adb -s $ADB_CTRL shell am start -n com.tao.tao.link/.ui.PairCodeActivity
            sleep 8
            dump ui-ctrl-1.xml $ADB_CTRL
            grep -o 'text="[^"]*"' ui-ctrl-1.xml | sort -u > texts-ctrl-1.txt || true
            cat texts-ctrl-1.txt
            CODE=$(grep -oE 'text="[0-9]{6}"' ui-ctrl-1.xml | head -1 | grep -oE '[0-9]{6}')
          fi
          echo "PAIRING_CODE=$CODE" | tee pairing-code.txt
          [ -n "$CODE" ] || { echo "FAIL_PAIRING_CODE_NOT_VISIBLE"; adb -s $ADB_CTRL logcat -d > logcat-ctrl-pair.txt 2>&1 || true; exit 1; }
          # 桥接：两模拟器各自 NAT 独立网段，mDNS 不互通；master 经 10.0.2.2（host 网关）→ forward → 被控端 48190
          adb -s $ADB_CTRL forward tcp:48190 tcp:48190
          adb -s $ADB_CTRL forward --list || true
          adb -s $ADB_CTRL shell netstat -tn 2>/dev/null | grep 48190 || true

      - name: "Stage B - master side, live-fire connect via pairing code deeplink"
        run: |
          dump() { adb -s $2 shell uiautomator dump /data/local/tmp/u.xml >/dev/null 2>&1 && adb -s $2 pull /data/local/tmp/u.xml "$1" >/dev/null 2>&1; }
          CODE=$(grep -oE '[0-9]{6}' pairing-code.txt | head -1)
          echo "CODE_FROM_CTRL=$CODE"
          adb -s $ADB_HOST logcat -c
          adb -s $ADB_HOST shell am start -n com.tao.tao.link/.ui.MainActivity; sleep 10
          # UI 输码路径在云环境注入不可靠（input tap/text 均不生效，已知病）；
          # 实弹走产品自带深链参数：ConnectingActivity(host, port, code) 与输码页提交逻辑同源
          adb -s $ADB_HOST shell am start -n com.tao.tao.link/.ui.ConnectingActivity --es host 10.0.2.2 --ei port 48190 --es code "$CODE"
          sleep 20
          dump ui-master-4.xml $ADB_HOST
          grep -o 'text="[^"]*"' ui-master-4.xml | sort -u > texts-master-4.txt || true
          cat texts-master-4.txt
          adb -s $ADB_HOST logcat -d > logcat-master-pair.txt || true
          grep -iE "taolink|pair|connect|session" logcat-master-pair.txt | grep -viE "ExplicitHealth|Icing|Bugle|Nearby|FastPair|resolv|netd|NetworkMonitor|ConnectivityService" | head -40 > discovery-log-master.txt || true
          cat discovery-log-master.txt || true

      - name: "Stage C - connection verdict on both sides"
        run: |
          dump() { adb -s $2 shell uiautomator dump /data/local/tmp/u.xml >/dev/null 2>&1 && adb -s $2 pull /data/local/tmp/u.xml "$1" >/dev/null 2>&1; }
          dump ui-ctrl-2.xml $ADB_CTRL
          grep -o 'text="[^"]*"' ui-ctrl-2.xml | sort -u > texts-ctrl-2.txt || true
          cat texts-ctrl-2.txt
          adb -s $ADB_CTRL logcat -d > logcat-ctrl-pair.txt || true
          grep -iE "NSD|mDNS|NsdManager|taolink|discover|connect" logcat-ctrl-pair.txt | head -60 > discovery-log-ctrl.txt || true
          cat discovery-log-ctrl.txt || true
          CONNECTED=0
          if grep -qE "已连接|连接成功|已配对" texts-master-4.txt 2>/dev/null; then CONNECTED=1; fi
          if grep -qE "已连接|连接成功|已配对" texts-ctrl-2.txt 2>/dev/null; then CONNECTED=1; fi
          if [ "$CONNECTED" = "1" ]; then
            echo "PASS_PAIR_CONNECTED"
          else
            echo "FAIL_PAIR_NOT_CONNECTED"
            echo "SKIP_LIVE_FIRE=1" >> $GITHUB_ENV
            exit 1
          fi

      - name: "Stage D - live fire, file transfer, voice, video"
        if: env.SKIP_LIVE_FIRE != '1'
        run: |
          # 云跑机点击注入不可靠（已确诊环境病）：实弹一律走 debug 导出组件直启 + auto_call 钩子，证据用引擎日志硬闸
          adb -s $ADB_HOST shell pm grant com.tao.tao.link android.permission.RECORD_AUDIO 2>/dev/null || true
          adb -s $ADB_HOST shell pm grant com.tao.tao.link android.permission.CAMERA 2>/dev/null || true
          adb -s $ADB_CTRL shell pm grant com.tao.tao.link android.permission.RECORD_AUDIO 2>/dev/null || true
          adb -s $ADB_CTRL shell pm grant com.tao.tao.link android.permission.CAMERA 2>/dev/null || true

          echo "== FILE: 应用侧文件发送/接收链路未接线（ManageActivity 文件入口为占位、被控端 CHUNK 帧未接处理），如实挂账不硬凑绿 =="
          echo "FILE_LIVE_FIRE=PENDING_FILE_UI_WIRING" | tee file-live-fire.txt

          echo "== VOICE live fire =="
          adb -s $ADB_HOST logcat -c; adb -s $ADB_CTRL logcat -c
          adb -s $ADB_HOST shell am start -n com.tao.tao.link/.ui.MasterCallActivity --es auto_call voice; sleep 20
          adb -s $ADB_HOST logcat -d > logcat-master-voice.txt || true
          adb -s $ADB_CTRL logcat -d > logcat-ctrl-voice.txt || true
          grep -c "语音对讲已发起" logcat-master-voice.txt > voice-start-count.txt || true
          grep -icE "对端来电，引擎应答|远端音频已就绪" logcat-ctrl-voice.txt > voice-ctrl-count.txt || true
          grep -icE "WebRTC|peerconnection|AudioRecord|audio" logcat-master-voice.txt > audio-frame-count-master.txt || true
          cat voice-start-count.txt voice-ctrl-count.txt audio-frame-count-master.txt
          START_OK=$( [ "$(cat voice-start-count.txt)" -ge 1 ] && echo 1 || echo 0 )
          CTRL_OK=$( [ "$(cat voice-ctrl-count.txt)" -ge 1 ] && echo 1 || echo 0 )
          [ "$START_OK" = "1" ] && [ "$CTRL_OK" = "1" ] || { echo "FAIL_VOICE_LIVE_FIRE"; exit 1; }
          echo "PASS_VOICE_LIVE_FIRE"
          adb -s $ADB_HOST shell am start -n com.tao.tao.link/.ui.MasterCallActivity --es auto_call hangup; sleep 5

          echo "== VIDEO live fire =="
          adb -s $ADB_HOST logcat -c; adb -s $ADB_CTRL logcat -c
          adb -s $ADB_HOST shell am start -n com.tao.tao.link/.ui.MasterCallActivity --es auto_call video; sleep 25
          adb -s $ADB_HOST logcat -d > logcat-master-video.txt || true
          adb -s $ADB_CTRL logcat -d > logcat-ctrl-video.txt || true
          grep -c "视频通话已发起" logcat-master-video.txt > video-start-count.txt || true
          grep -icE "对端来电，引擎应答|远端视频轨就绪|本地视频轨就绪" logcat-ctrl-video.txt > video-ctrl-count.txt || true
          grep -icE "WebRTC|peerconnection|VideoCapture|encode|video" logcat-master-video.txt > video-frame-count-master.txt || true
          cat video-start-count.txt video-ctrl-count.txt video-frame-count-master.txt
          VSTART_OK=$( [ "$(cat video-start-count.txt)" -ge 1 ] && echo 1 || echo 0 )
          VCTRL_OK=$( [ "$(cat video-ctrl-count.txt)" -ge 1 ] && echo 1 || echo 0 )
          [ "$VSTART_OK" = "1" ] && [ "$VCTRL_OK" = "1" ] || { echo "FAIL_VIDEO_LIVE_FIRE"; exit 1; }
          echo "PASS_VIDEO_LIVE_FIRE"
          adb -s $ADB_HOST shell am start -n com.tao.tao.link/.ui.MasterCallActivity --es auto_call hangup; sleep 3
          adb -s $ADB_HOST shell screencap -p /data/local/tmp/s.png && adb -s $ADB_HOST pull /data/local/tmp/s.png shot-call-master.png || true
          echo "PASS_STAGE_D_LIVE_FIRE"

      - name: Upload evidence
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-device-evidence
          path: |
            ui-*.xml
            texts-*.txt
            pairing-code.txt
            discovery-log-*.txt
            logcat-*.txt
            audio-frame-count-master.txt
            video-frame-count-master.txt
            emu-master.log
            emu-ctrl.log
            gradle-build.log
          if-no-files-found: warn
